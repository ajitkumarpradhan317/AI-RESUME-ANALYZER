# Throwaway Postgres for integration tests:  docker compose -f docker-compose.test.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ats_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
